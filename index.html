<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24 card Memory Game</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-flip: #f8fafc;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --shadow: rgba(15, 23, 42, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 60%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }

    .app {
      width: min(100%, 980px);
      padding: 24px;
      border-radius: 28px;
      background: rgba(15, 23, 42, 0.94);
      box-shadow: 0 30px 80px var(--shadow);
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: clamp(1.8rem, 2.4vw, 2.8rem);
      line-height: 1.05;
    }

    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat {
      background: rgba(148, 163, 184, 0.1);
      padding: 12px 16px;
      border-radius: 16px;
      min-width: 92px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 1.2rem;
      color: #f8fafc;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .button,
    button {
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
      color: #0f172a;
      background: #38bdf8;
    }

    .button:hover,
    button:hover {
      transform: translateY(-1px);
      background: #22c55e;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .card {
      width: 100%;
      aspect-ratio: 1 / 1;
      perspective: 1000px;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.45s ease;
      border-radius: 20px;
      box-shadow: 0 16px 30px rgba(15, 23, 42, 0.3);
      cursor: pointer;
    }

    .card.revealed .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: inherit;
      backface-visibility: hidden;
    }

    .card-front {
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .card-back {
      background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
      transform: rotateY(180deg);
      border: 1px solid rgba(15, 23, 42, 0.12);
      color: #0f172a;
      font-size: clamp(1.7rem, 2vw, 2.4rem);
      font-weight: 700;
    }

    .card-back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
    }

    .message {
      margin-top: 24px;
      padding: 18px 20px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #cbe7ff;
      font-size: 1rem;
    }

    @media (max-width: 640px) {
      .board {
        gap: 10px;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h1>24 card Memory Game</h1>
        <p>Match all 12 pairs. Tap two cards to reveal them.</p>
      </div>
      <div class="buttons">
        <button id="restartBtn">Restart</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <span>Moves</span>
        <strong id="movesCount">0</strong>
      </div>
      <div class="stat">
        <span>Matches</span>
        <strong id="matchesCount">0 / 12</strong>
      </div>
      <div class="stat">
        <span>Time</span>
        <strong id="timer">00:00</strong>
      </div>
    </div>

    <div class="board" id="board"></div>
    <div class="message" id="message">Ready to play! Flip the first card.</div>
  </div>

  <script>
    const board = document.getElementById('board');
    const movesCountEl = document.getElementById('movesCount');
    const matchesCountEl = document.getElementById('matchesCount');
    const timerEl = document.getElementById('timer');
    const messageEl = document.getElementById('message');
    const restartBtn = document.getElementById('restartBtn');

    const PAIRS = 12;
    const IMAGE_PATHS = [
      'monks/monk default.png',
      'monks/monk diff0.png',
      'monks/monk diff1.png',
      'monks/monk diff2.png',
      'monks/monk diff3.png',
      'monks/monk diff4.png',
      'monks/monk diff5.png',
      'monks/monk diff6.png',
      'monks/monk diff7.png',
      'monks/monk diff8.png',
      'monks/monk diff9.png',
      'monks/monk diff10.png'
    ];

    let cardValues = [];
    let moves = 0;
    let matches = 0;
    let seconds = 0;
    let timerInterval = null;
    let started = false;
    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;

    function createCardValues() {
      const chosenImages = shuffle([...IMAGE_PATHS]).slice(0, PAIRS);
      const values = chosenImages.flatMap((path) => [path, path]);
      return shuffle(values);
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function formatTime(sec) {
      const minutes = String(Math.floor(sec / 60)).padStart(2, '0');
      const secondsPart = String(sec % 60).padStart(2, '0');
      return `${minutes}:${secondsPart}`;
    }

    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        seconds += 1;
        timerEl.textContent = formatTime(seconds);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function updateStats() {
      movesCountEl.textContent = moves;
      matchesCountEl.textContent = `${matches} / ${PAIRS}`;
    }

    function resetBoardState() {
      firstCard = null;
      secondCard = null;
      lockBoard = false;
    }

    function revealCard(card) {
      if (lockBoard || card === firstCard || card.classList.contains('matched')) return;
      card.classList.add('revealed');
      if (!started) {
        started = true;
        startTimer();
      }
      if (!firstCard) {
        firstCard = card;
        messageEl.textContent = 'Select another card to find a match.';
        return;
      }
      secondCard = card;
      moves += 1;
      updateStats();
      checkForMatch();
    }

    function checkForMatch() {
      const firstValue = firstCard.dataset.value;
      const secondValue = secondCard.dataset.value;
      if (firstValue === secondValue) {
        disableMatchedCards();
      } else {
        unflipNonMatchingCards();
      }
    }

    function disableMatchedCards() {
      firstCard.classList.add('matched');
      secondCard.classList.add('matched');
      matches += 1;
      updateStats();
      resetBoardState();
      if (matches === PAIRS) {
        stopTimer();
        messageEl.textContent = `Victory! You finished in ${moves} moves and ${formatTime(seconds)}.`;
      } else {
        messageEl.textContent = `Nice match! ${PAIRS - matches} pairs to go.`;
      }
    }

    function unflipNonMatchingCards() {
      lockBoard = true;
      messageEl.textContent = 'No match. Try again.';
      setTimeout(() => {
        firstCard.classList.remove('revealed');
        secondCard.classList.remove('revealed');
        resetBoardState();
        messageEl.textContent = 'Pick a new card.';
      }, 900);
    }

    function createCard(value) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.value = value;
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-front"></div>
          <div class="card-face card-back">
            <img src="${encodeURI(value)}" alt="Monk card" draggable="false">
          </div>
        </div>
      `;
      card.addEventListener('click', () => revealCard(card));
      return card;
    }

    function renderBoard() {
      board.innerHTML = '';
      cardValues = createCardValues();
      cardValues.forEach((value) => {
        board.appendChild(createCard(value));
      });
    }

    function resetGame() {
      stopTimer();
      seconds = 0;
      timerEl.textContent = formatTime(seconds);
      moves = 0;
      matches = 0;
      started = false;
      updateStats();
      messageEl.textContent = 'Game reset. Flip a card to begin.';
      resetBoardState();
      renderBoard();
    }

    restartBtn.addEventListener('click', resetGame);

    resetGame();
  </script>
</body>
</html>
