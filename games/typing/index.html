<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Speed Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h1>Typing Speed Test</h1>
        <p>Type the text below as fast and accurately as you can.</p>
      </div>
      <div class="buttons">
        <button id="restartBtn">Restart</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <span>Time</span>
        <strong id="timer">00:00</strong>
      </div>
      <div class="stat">
        <span>WPM</span>
        <strong id="wpm">0</strong>
      </div>
      <div class="stat">
        <span>Accuracy</span>
        <strong id="accuracy">100%</strong>
      </div>
    </div>

    <div class="typing-container">
  <div id="quote-display" class="quote-box"></div>
  <textarea id="typing-input" placeholder="Start typing here..." autocomplete="off"></textarea>
</div>

    <div class="message" id="message">Type the first letter to start!</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
