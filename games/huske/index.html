<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24 Card Memory Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body >
  <div class="app">
    <div class="header">
      <div>
        <h1 id="game-title">24 card Memory Game</h1 >
        <p id="game-desc">Match all 12 pairs. Tap two cards to reveal them.</p>
      </div>
      <div class="challenge-controls">
        <label class="toggle-label" style="display: flex; align-items: center; gap: 8px;">
            Shuffle Challenge: 
            <input type="checkbox" id="shuffleChallengeToggle" checked>
        </label>
      </div>
      <div class="buttons">
        <button id="restartBtn">Restart</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <span>Moves</span >
        <strong id="movesCount">0</strong >
      </div>
      <div class="stat">
        <span>Matches</span >
        <strong id="matchesCount">0 / 12</strong >
      </div>
      <div class="stat">
        <span>Time</span >
        <strong id="timer">00:00</strong >
      </div>
    </div>

    <div class="board" id="board"></div>
    <div class="message" id="message">Ready to play! Flip the first card.</div >
  </div >

  <script src="script.js"></script>
</body >
</html>
